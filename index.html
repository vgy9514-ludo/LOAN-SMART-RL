<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOAN SMART · RL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#15171a;--muted:#69717d;--line:#e4e7eb;--brand:#146b45;--soft:#eaf5ef;--yellow:#a66b00;--yellowbg:#fff5d9;--red:#c0392b;--redbg:#ffebe8;--shadow:0 10px 35px #1018280d}*{box-sizing:border-box}html[data-theme=dark]{--bg:#101214;--panel:#181b1f;--text:#f4f6f8;--muted:#aab2bd;--line:#2b3037;--brand:#5fd39b;--soft:#183025;--yellow:#ffd166;--yellowbg:#342b16;--red:#ff8578;--redbg:#351b18;--shadow:0 10px 35px #0006}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{min-height:100vh;display:flex}.side{width:245px;background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin:4px 8px 30px}.mark{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:20px}.side nav{display:grid;gap:6px}.side button,.top button{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer}.nav{padding:12px;border-radius:11px;text-align:left}.nav.active,.nav:hover{background:var(--soft);color:var(--brand);font-weight:700}.ai{margin-top:18px;background:var(--brand)!important;color:#fff!important;border-radius:11px;padding:12px!important}.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.content{margin-left:245px;width:calc(100% - 245px);min-height:100vh}.top{height:68px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px;position:sticky;top:0;z-index:3}.mobile-brand{display:none}.actions{display:flex;gap:10px;align-items:center}.icon{padding:9px;border:1px solid var(--line)!important;border-radius:9px}.profile{border:1px solid var(--line)!important;border-radius:20px;padding:8px 12px!important}.main{max-width:1200px;margin:auto;padding:28px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--brand);margin:0 0 7px}.hero h1,.title h1{font-size:32px;line-height:1.1;margin:0 0 10px}.hero p,.title p{color:var(--muted);margin:0;max-width:700px}.btn{border:1px solid var(--line);border-radius:10px;padding:11px 15px;background:var(--panel);color:var(--text);font-weight:700;cursor:pointer}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h2{font-size:18px;margin:0}.head p{color:var(--muted);margin:5px 0 0;font-size:13px}.pill{font-size:11px;border-radius:99px;padding:6px 9px;background:var(--soft);color:var(--brand);font-weight:800}.ranges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.metric{padding:17px;border-radius:13px;border:1px solid var(--line)}.metric span{display:block;color:var(--muted);font-size:13px}.metric b{display:block;font-size:24px;margin:6px 0}.metric small{color:var(--muted)}.green{background:var(--soft)}.yellow{background:var(--yellowbg)}.red{background:var(--redbg)}.budget{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:14px;padding-top:14px;color:var(--muted);font-size:13px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.title{margin-bottom:20px}.calc{display:grid;grid-template-columns:1.35fr .75fr;gap:20px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{display:grid;gap:7px;font-size:12px;font-weight:700}.field input,.field select,.modal input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit}.toggle{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:10px;margin:15px 0}.toggle button{flex:1;border:0;background:transparent;padding:9px;border-radius:7px;color:var(--muted);font-weight:700;cursor:pointer}.toggle .sel{background:var(--panel);color:var(--brand);box-shadow:var(--shadow)}.result{background:var(--brand);color:#fff;border-radius:16px;padding:22px;height:max-content}.result .eyebrow{color:#d7ffe9}.result .big{font-size:34px;font-weight:850;margin:6px 0 18px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini div{padding:12px;background:#ffffff14;border-radius:10px}.mini span{display:block;font-size:11px;opacity:.8}.mini b{font-size:15px}.safe{margin-top:14px;padding:12px;background:#ffffff12;border-radius:10px}.safe b{float:right}.safe small{display:block;opacity:.8;margin-top:5px}.loan{display:grid;grid-template-columns:44px 1fr auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.loan:last-child{border-bottom:0}.loanicon{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--brand);font-weight:800}.loan strong{display:block}.loan span{font-size:12px;color:var(--muted)}.due{font-size:11px;text-align:right;color:var(--muted)}.due b{display:block;color:var(--text);font-size:12px;margin-top:3px}.due.soon b,.due.overdue b{color:var(--red)}.empty{text-align:center;padding:35px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted)}.tablewrap{overflow:auto}.setting{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.setting span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.note{margin-top:15px;padding:13px;background:var(--soft);border-radius:10px;font-size:12px}.overlay{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(460px,100%);background:var(--panel);border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}.modal form{display:grid;gap:12px}.modal label{font-size:12px;font-weight:700;display:grid;gap:6px}.msg{padding:10px;background:var(--soft);border-radius:9px;font-size:12px}.chat{min-height:100px;background:var(--bg);border-radius:12px;padding:14px;margin:12px 0;color:var(--text);font-size:13px;line-height:1.5}.chatrow{display:flex;gap:8px}.chatrow input{flex:1}.footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 28px}.hide{display:none!important}@media(max-width:850px){.side{display:none}.content{margin-left:0;width:100%}.top{padding:0 16px}.mobile-brand{display:flex;align-items:center;gap:8px;font-size:14px}.main{padding:18px 14px}.hero,.grid2,.calc{grid-template-columns:1fr;display:grid}.ranges,.fields{grid-template-columns:1fr}.hero h1,.title h1{font-size:27px}.loan{grid-template-columns:40px 1fr auto}.loan-pay{grid-column:2}.due{grid-column:3;grid-row:1/3}.top .profile span{display:none}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="mark">₹</div>LOAN SMART · RL</div><nav id="nav"></nav><button class="ai" id="aiBtn">✦ Ask AI Assistant</button><div class="bottom"><span>© 2026 RL</span><button id="themeSide">🌙</button></div></aside><div class="content"><header class="top"><div class="mobile-brand"><div class="mark">₹</div><b>LOAN SMART · RL</b></div><div class="actions"><button class="icon" id="theme">🌙</button><button class="profile" id="authTop">Login</button></div></header><main class="main" id="appmain"></main><div class="footer">LOAN SMART · RL • © 2026 RL</div></div></div><div id="modalroot"></div>
<script>
const SUPABASE_URL='YOUR_SUPABASE_URL';const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
const sb=(window.supabase&&SUPABASE_URL.startsWith('http'))?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const langs=['English','తెలుగు','हिन्दी','தமிழ்','ಕನ್ನಡ','മലയാളം','मराठी','বাংলা','ગુજરાતી','ਪੰਜਾਬੀ','ଓଡ଼ିଆ','অসমীয়া','اردو'];
let state={tab:'dashboard',dark:localStorage.getItem('ls-theme')==='dark',salary:50000,expenses:20000,existing:0,amount:100000,rate:18,months:12,freq:'monthly',start:new Date().toISOString().slice(0,10),loans:JSON.parse(localStorage.getItem('ls-loans')||'[]'),saved:JSON.parse(localStorage.getItem('ls-saved')||'[]'),user:null,language:localStorage.getItem('ls-lang')||'English'};
const money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
function emi(P,annual,months){if(!P||months<=0)return 0;let r=annual/12/100;if(r===0)return P/months;return P*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1)}
function affordability(s,e,x){let a=Math.max(0,s-e-x);return{available:a,comfortable:a*.30,higher:a*.40,risky:a*.50}}
function schedule(P,annual,months,start,freq){let payment=emi(P,annual,months),n=freq==='weekly'?Math.max(1,Math.round(months*52/12)):months,rate=freq==='weekly'?annual/52/100:annual/12/100,bal=P,arr=[];if(rate===0)payment=P/n;for(let i=1;i<=n;i++){let interest=bal*rate,principal=Math.min(bal,Math.max(0,payment-interest)),pay=principal+interest;bal=Math.max(0,bal-principal);let d=new Date(start);if(freq==='weekly')d.setDate(d.getDate()+(i-1)*7);else d.setMonth(d.getMonth()+i-1);arr.push({n:i,date:d.toISOString().slice(0,10),payment:pay,principal,interest,balance:bal})}return arr}
function cap(){return affordability(state.salary,state.expenses,state.existing)}
function payment(){return state.freq==='monthly'?emi(state.amount,state.rate,state.months):schedule(state.amount,state.rate,state.months,state.start,'weekly')[0].payment}
function total(){return schedule(state.amount,state.rate,state.months,state.start,state.freq).reduce((a,r)=>a+r.payment,0)}
function dueClass(date){let d=(new Date(date)-new Date())/86400000;return d<0?'overdue':d<=3?'soon':''}
function saveLocal(){localStorage.setItem('ls-loans',JSON.stringify(state.loans));localStorage.setItem('ls-saved',JSON.stringify(state.saved))}
function nav(){let items=[['dashboard','⌂','Dashboard'],['calculator','◉','EMI Calculator'],['loans','▣','My Loans'],['saved','☆','Saved'],['settings','⚙','Settings']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="nav ${state.tab===x[0]?'active':''}" data-tab="${x[0]}">${x[1]} &nbsp;${x[2]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()})}
function dashboard(){let c=cap();return `<section class="hero"><div><p class="eyebrow">SMART MONEY PLANNING</p><h1>Know your EMI before you commit.</h1><p>Plan a loan around your real monthly budget — not just what a lender says you can borrow.</p></div><button class="btn primary" onclick="go('calculator')">Calculate EMI →</button></section><section class="panel"><div class="head"><div><h2>Your safe EMI range</h2><p>Based on income, expenses and existing EMI.</p></div><span class="pill">● LIVE</span></div><div class="ranges"><div class="metric green"><span>Comfortable</span><b>${money(c.comfortable)}</b><small>Best for your budget</small></div><div class="metric yellow"><span>Higher</span><b>${money(c.higher)}</b><small>Use with caution</small></div><div class="metric red"><span>Risky</span><b>${money(c.risky)}</b><small>Avoid if possible</small></div></div><div class="budget"><span>Money available after current expenses</span><b>${money(c.available)}</b></div></section><div class="grid2"><section class="panel"><div class="head"><div><h2>My loans</h2><p>Upcoming payments at a glance.</p></div><button class="btn" onclick="go('loans')">View all</button></div>${loanRows(3)}</section><section class="panel"><p class="eyebrow">SMART ASSISTANT</p><h2>Need a second opinion?</h2><p style="color:var(--muted)">Ask the AI assistant about affordability, EMI, interest, prepayment or your repayment schedule.</p><button class="btn primary" onclick="openAI()">Ask AI Assistant</button></section></div>`}
function loanRows(limit=99){if(!state.loans.length)return `<div class="empty">No loans saved yet.<br><br><button class="btn primary" onclick="go('calculator')">Add your first loan</button></div>`;return state.loans.slice(0,limit).map(l=>{let dc=dueClass(l.next_payment);return `<div class="loan"><div class="loanicon">₹</div><div><strong>${esc(l.name)}</strong><span>${money(l.amount)} · ${l.rate}% · ${l.frequency}</span></div><div class="due ${dc}">${dc==='soon'?'Due soon':dc==='overdue'?'Overdue':'Next payment'}<b>${l.next_payment}</b></div><div class="loan-pay"><strong>${money(l.payment)}</strong><span> / ${l.frequency==='monthly'?'month':'week'}</span></div></div>`}).join('')}
function calculator(){let c=cap(),rows=schedule(state.amount,state.rate,state.months,state.start,state.freq),p=payment();return `<div class="title"><p class="eyebrow">CALCULATOR</p><h1>Build a loan plan that fits.</h1><p>Change any number and the result updates instantly.</p></div><div class="calc"><section class="panel"><h2>Loan + budget details</h2><div class="fields"><label class="field">Monthly salary<input id="salary" type="number" value="${state.salary}"></label><label class="field">Existing expenses<input id="expenses" type="number" value="${state.expenses}"></label><label class="field">Existing EMI<input id="existing" type="number" value="${state.existing}"></label><label class="field">Loan amount<input id="amount" type="number" value="${state.amount}"></label><label class="field">Annual interest %<input id="rate" type="number" step=".1" value="${state.rate}"></label><label class="field">Tenure (months)<input id="months" type="number" value="${state.months}"></label></div><div class="toggle"><button class="${state.freq==='monthly'?'sel':''}" onclick="state.freq='monthly';render()">Monthly</button><button class="${state.freq==='weekly'?'sel':''}" onclick="state.freq='weekly';render()">Weekly</button></div><label class="field">Next payment date<input id="start" type="date" value="${state.start}"></label><div style="display:flex;gap:8px;margin-top:15px;flex-wrap:wrap"><button class="btn" onclick="saveCalc()">☆ Save calculation</button><button class="btn primary" onclick="addLoan()">+ Add to My Loans</button></div></section><aside class="result"><p class="eyebrow">YOUR ESTIMATE</p><div>${state.freq==='monthly'?'Monthly EMI':'Weekly payment'}</div><div class="big">${money(p)}</div><div class="mini"><div><span>Total interest</span><b>${money(total()-state.amount)}</b></div><div><span>Total repayment</span><b>${money(total())}</b></div></div><div class="safe"><span>🟢 Comfortable EMI</span><b>${money(c.comfortable)}</b><small>Ideally stay below this.</small></div><div class="safe"><span>🟡 Higher EMI</span><b>${money(c.higher)}</b></div><div class="safe"><span>🔴 Risky EMI</span><b>${money(c.risky)}</b></div></aside></div><section class="panel"><div class="head"><div><h2>Repayment schedule</h2><p>Principal, interest and remaining balance.</p></div><button class="btn" onclick="exportCSV()">📤 Excel/CSV</button></div><div class="tablewrap"><table><thead><tr><th>#</th><th>Date</th><th>Payment</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.n}</td><td>${r.date}</td><td>${money(r.payment)}</td><td>${money(r.principal)}</td><td>${money(r.interest)}</td><td>${money(r.balance)}</td></tr>`).join('')}</tbody></table></div></section>`}
function loans(){return `<div class="title"><p class="eyebrow">MY LOANS</p><h1>Your loans, in one place.</h1><p>Track every payment until the loan is complete.</p></div><section class="panel">${loanRows()}</section><div class="grid2"><section class="panel"><b>🔴 Payment reminders</b><p style="color:var(--muted)">Loans due within 3 days are highlighted in red.</p></section><section class="panel"><b>📄 Documents & exports</b><p style="color:var(--muted)">Optional document storage and payment-history export can be connected through Supabase Storage.</p></section></div>`}
function saved(){return `<div class="title"><p class="eyebrow">SAVED</p><h1>Your saved calculations.</h1><p>Keep scenarios and compare them later.</p></div><section class="panel">${state.saved.length?state.saved.map(x=>`<div class="loan"><div class="loanicon">☆</div><div><strong>${esc(x.title)}</strong><span>${new Date(x.created_at).toLocaleString()}</span></div><div><b>${money(x.payment)}</b></div></div>`).join(''):`<div class="empty">Nothing saved yet.</div>`}</section>`}
function settings(){return `<div class="title"><p class="eyebrow">SETTINGS</p><h1>Simple. Private. Yours.</h1><p>Appearance, language and account security.</p></div><section class="panel"><div class="setting"><div><b>Appearance</b><span>Choose light or dark mode.</span></div><div class="toggle" style="width:220px"><button class="${!state.dark?'sel':''}" onclick="setTheme(false)">☀️ Light</button><button class="${state.dark?'sel':''}" onclick="setTheme(true)">🌙 Dark</button></div></div><div class="setting"><div><b>Language</b><span>Applies across the app.</span></div><select id="lang" class="field" style="width:220px;padding:10px">${langs.map(l=>`<option ${l===state.language?'selected':''}>${l}</option>`).join('')}</select></div><div class="setting"><div><b>Account</b><span>${state.user?'Signed in. Cloud sync is active.':'Login to sync across devices.'}</span></div><button class="btn ${state.user?'':'primary'}" onclick="${state.user?'logout()':'openAuth()'}">${state.user?'Logout':'Login / Sign up'}</button></div><div class="note">🔐 Supabase Auth handles passwords securely. LOAN SMART never stores passwords in plain text, and financial information is never placed in URLs. Normal login uses username + password; verified email is used for password recovery.</div></section>`}
function render(){document.documentElement.dataset.theme=state.dark?'dark':'light';localStorage.setItem('ls-theme',state.dark?'dark':'light');nav();document.getElementById('appmain').innerHTML=state.tab==='dashboard'?dashboard():state.tab==='calculator'?calculator():state.tab==='loans'?loans():state.tab==='saved'?saved():settings();const lang=document.getElementById('lang');if(lang)lang.onchange=()=>{state.language=lang.value;localStorage.setItem('ls-lang',state.language)};bindCalc()}
function bindCalc(){['salary','expenses','existing','amount','rate','months','start'].forEach(id=>{let e=document.getElementById(id);if(e)e.oninput=()=>{state[id]=id==='start'?e.value:Number(e.value);render()}})}
function go(t){state.tab=t;render()}function setTheme(v){state.dark=v;render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveCalc(){state.saved.unshift({title:`${money(state.amount)} · ${state.rate}% · ${state.months} months`,payment:payment(),created_at:new Date().toISOString()});saveLocal();cloudSaveCalc();alert('Calculation saved.');render()}
function addLoan(){let l={id:crypto.randomUUID(),name:`${state.freq==='monthly'?'Monthly':'Weekly'} loan · ${money(state.amount)}`,amount:state.amount,rate:state.rate,months:state.months,payment:payment(),frequency:state.freq,next_payment:state.start,remaining:state.amount,status:'active'};state.loans.unshift(l);saveLocal();cloudAddLoan(l);go('loans')}
async function cloudSaveCalc(){if(!sb||!state.user)return;await sb.from('saved_calculations').insert({user_id:state.user.id,title:state.saved[0].title,kind:'emi',payload:{...state}})}
async function cloudAddLoan(l){if(!sb||!state.user)return;await sb.from('loans').insert({...l,user_id:state.user.id})}
async function sync(){if(!sb||!state.user)return;let a=await sb.from('loans').select('*').order('created_at',{ascending:false});let b=await sb.from('saved_calculations').select('*').order('created_at',{ascending:false});if(a.data)state.loans=a.data;if(b.data)state.saved=b.data;saveLocal();render()}
function openAuth(mode='login'){document.getElementById('modalroot').innerHTML=`<div class="overlay"><div class="modal"><div class="modalhead"><div><b id="authTitle">${mode==='login'?'Welcome back':mode==='signup'?'Create account':'Reset password'}</b><div style="color:var(--muted);font-size:12px">LOAN SMART · RL</div></div><button class="btn" onclick="closeModal()">×</button></div><form id="authform">${mode==='login'||mode==='signup'?'<label>Username<input id="username" required minlength="3" placeholder="your username"></label>':''}${mode!=='login'?'<label>Verified email<input id="email" type="email" required placeholder="you@example.com"></label>':''}${mode!=='reset'?'<label>Password<input id="password" type="password" required minlength="6" placeholder="••••••••"></label>':''}<button class="btn primary" type="submit">${mode==='login'?'Login':mode==='signup'?'Create account':'Send recovery email'}</button></form><div id="authmsg"></div><p style="font-size:12px;color:var(--muted)">${mode==='login'?'<button class="btn" onclick="openAuth(\'signup\')">Create account</button> <button class="btn" onclick="openAuth(\'reset\')">Forgot password?</button>':'<button class="btn" onclick="openAuth(\'login\')">Login</button>'}</p></div></div>`;document.getElementById('authform').onsubmit=e=>authSubmit(e,mode)}
async function authSubmit(e,mode){e.preventDefault();let msg=document.getElementById('authmsg');msg.className='msg';if(!sb){msg.textContent='Add your Supabase URL and anon key in index.html first.';return}try{if(mode==='reset'){let email=document.getElementById('email').value;let {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;msg.textContent='Recovery email sent. Use the secure link in your verified email.';return}let username=document.getElementById('username').value.trim(),email=document.getElementById('email')?.value,password=document.getElementById('password').value;if(mode==='signup'){let r=await sb.auth.signUp({email,password});if(r.error)throw r.error;if(r.data.user){let p=await sb.from('profiles').insert({id:r.data.user.id,username,email});if(p.error)throw p.error}msg.textContent='Account created. Check your email if confirmation is enabled.';state.user=r.data.user;closeModal();sync();return}let look=await sb.rpc('lookup_email_by_username',{p_username:username});if(look.error||!look.data)throw new Error('Username not found.');let r=await sb.auth.signInWithPassword({email:look.data,password});if(r.error)throw r.error;state.user=r.data.user;closeModal();sync();render()}catch(err){msg.textContent=err.message||'Something went wrong'}}
async function logout(){if(sb)await sb.auth.signOut();state.user=null;render()}function closeModal(){document.getElementById('modalroot').innerHTML=''}
function openAI(){document.getElementById('modalroot').innerHTML=`<div class="overlay"><div class="modal"><div class="modalhead"><div><b>✦ AI Loan Assistant</b><div style="color:var(--muted);font-size:12px">Simple answers, no paid API required</div></div><button class="btn" onclick="closeModal()">×</button></div><div class="chat" id="answer">Ask about EMI, affordability, interest, prepayment, or your loans.</div><div class="chatrow"><input id="q" placeholder="Ask something about your loan…"><button class="btn primary" onclick="askAI()">Ask</button></div></div></div>`}
function askAI(){let q=document.getElementById('q').value.toLowerCase(),c=cap(),p=payment(),a;if(q.includes('salary')||q.includes('afford'))a=`With ${money(state.salary)} salary, ${money(state.expenses)} expenses and ${money(state.existing)} existing EMI, your estimated EMI ranges are ${money(c.comfortable)} comfortable, ${money(c.higher)} higher and ${money(c.risky)} risky.`;else if(q.includes('interest')||q.includes('emi'))a=`For ${money(state.amount)} at ${state.rate}% for ${state.months} months, your ${state.freq} payment is about ${money(p)}. Estimated interest is ${money(total()-state.amount)}.`;else if(q.includes('prepay'))a='Extra principal paid earlier can reduce future interest. Check your lender for any prepayment or foreclosure charges.';else if(q.includes('reminder')||q.includes('due'))a='Loans due within 3 days are shown in red in My Loans. The reminder remains visible until the next payment date changes.';else a='I can help with EMI, salary affordability, repayment schedules, interest, prepayment and loan comparisons. Ask a specific question.';document.getElementById('answer').textContent=a}
function exportCSV(){let rows=schedule(state.amount,state.rate,state.months,state.start,state.freq),csv='No,Date,Payment,Principal,Interest,Balance\n'+rows.map(r=>[r.n,r.date,r.payment.toFixed(2),r.principal.toFixed(2),r.interest.toFixed(2),r.balance.toFixed(2)].join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='loan-smart-payment-history.csv';a.click()}
document.getElementById('theme').onclick=()=>setTheme(!state.dark);document.getElementById('themeSide').onclick=()=>setTheme(!state.dark);document.getElementById('authTop').onclick=()=>state.user?go('settings'):openAuth();document.getElementById('aiBtn').onclick=openAI;
if(sb){sb.auth.getSession().then(({data})=>{state.user=data.session?.user||null;render();if(state.user)sync()});sb.auth.onAuthStateChange((_e,s)=>{state.user=s?.user||null;render()})}render();
</script></body></html>
