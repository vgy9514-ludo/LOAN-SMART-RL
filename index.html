const dateFmt=d=>d?new Intl.DateTimeFormat(state.language==='English'?'en-IN':undefined,{day:'2-digit',month:'short',year:'numeric'}).format(new Date(d+'T00:00:00')):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function emi(P,annual,months){P=Number(P)||0;months=Number(months)||0;if(!P||months<=0)return 0;let r=(Number(annual)||0)/12/100;if(r===0)return P/months;return P*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1)}
function schedule(P,annual,months,start,freq='monthly'){
 P=Number(P)||0;months=Number(months)||0;
 let n=freq==='weekly'?Math.max(1,Math.round(months*52/12)):months;
 let rate=freq==='weekly'?(Number(annual)||0)/52/100:(Number(annual)||0)/12/100;
 let payment=freq==='weekly'?((rate===0)?P/n:P*rate*Math.pow(1+rate,n)/(Math.pow(1+rate,n)-1)):emi(P,annual,months);
 let bal=P,arr=[];
 const base=(start||new Date().toISOString().slice(0,10)).split('-').map(Number);
 const baseYear=base[0],baseMonth=base[1]-1,baseDay=base[2];
 for(let i=1;i<=n;i++){
  let interest=bal*rate,principal=Math.min(bal,Math.max(0,payment-interest)),pay=principal+interest;
  bal=Math.max(0,bal-principal);
  let d=new Date(baseYear,baseMonth,baseDay);
  if(freq==='weekly')d.setDate(d.getDate()+i*7);
  else d.setMonth(d.getMonth()+i);
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  arr.push({n:i,date:`${y}-${m}-${day}`,payment:pay,principal,interest,balance:bal,status:'pending'});
 }
 return arr;
}
function affordability(s,e,x){let a=Math.max(0,(Number(s)||0)-(Number(e)||0)-(Number(x)||0));return{available:a,comfortable:a*.30,higher:a*.40,risky:a*.50}}

function dateOnlyValue(value){
 if(!value)return null;
 const [y,m,d]=String(value).slice(0,10).split('-').map(Number);
 if(!y||!m||!d)return null;
 return Date.UTC(y,m-1,d);
}
function dueClass(date){
 const target=dateOnlyValue(date),today=dateOnlyValue(new Date().toISOString().slice(0,10));
 if(target===null||today===null)return '';
 const d=(target-today)/86400000;
 return d<0?'overdue':d<=3?'soon':'';
}

async function authSubmit(e,mode){
 e.preventDefault();const msg=document.getElementById('authmsg');msg.className='msg';msg.textContent='…';

 try{
  if(mode==='reset'){
   const email=document.getElementById('email').value.trim();
   const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
   if(error)throw error;msg.textContent=tr('recoverySent');return;
  }
  const username=document.getElementById('username').value.trim().toLowerCase(),email=document.getElementById('email')?.value.trim(),password=document.getElementById('password').value;
  if(mode==='signup'){
   if(password!==document.getElementById('password2').value)throw new Error('Passwords do not match.');
   const {data,error}=await sb.auth.signUp({email,password,options:{data:{username},emailRedirectTo:location.origin+location.pathname}});
   if(error)throw error;
   if(data.user&&data.session){await ensureProfile(data.user,username,email)}
   closeModal();toast(tr('checkEmail'));return;
  }
  let loginEmail=username;
  if(!username.includes('@')){
   const {data,error}=await sb.rpc('lookup_email_by_username',{p_username:username});
   if(error||!data)throw new Error(tr('usernameNotFound'));
   loginEmail=data;
  }
  const {data,error}=await sb.auth.signInWithPassword({email:loginEmail,password});
  if(error)throw error;
  state.user=data.user;await sync();closeModal();render();
 }catch(err){msg.className='msg error';msg.textContent=friendlyAuthError(err)}
}

}
function addLoan(existing=null){
 const l=existing||{id:crypto.randomUUID(),name:`${state.freq==='monthly'?tr('monthly'):tr('weekly')} loan · ${money(state.amount)}`,amount:Number(state.amount)||0,rate:Number(state.rate)||0,months:Number(state.months)||1,payment:payment(),frequency:state.freq,next_payment:state.start,remaining:Number(state.amount)||0,status:'active'};
 if(existing){const i=state.loans.findIndex(x=>x.id===existing.id);if(i>=0)state.loans[i]=l}else state.loans.unshift(l);
 render();cloudUpsertLoan(l);go('loans');
}
async function cloudUpsertLoan(l){
 if(!sb||!state.user)return;
 const row={id:l.id,user_id:state.user.id,name:l.name,amount:l.amount,rate:l.rate,months:l.months,payment:l.payment,frequency:l.frequency,next_payment:l.next_payment,remaining:l.remaining,status:l.status};
 const {error}=await sb.from('loans').upsert(row);if(error)console.warn(error);
}
function editLoan(id){
 const l=state.loans.find(x=>x.id===id);if(!l)return;state.editingLoanId=id;
 document.getElementById('modalroot').innerHTML=`<div class="overlay"><div class="modal"><div class="modalhead"><div><b>${tr('editLoan')}</b></div><button class="btn" onclick="closeModal()">×</button></div>
 <form id="loanEditForm"><label>${tr('username')} / Loan name<input id="elname" value="${esc(l.name)}"></label><label>${tr('amount')}<input id="elamount" type="number" value="${l.amount}"></label><label>${tr('rate')}<input id="elrate" type="number" step=".1" value="${l.rate}"></label><label>${tr('months')}<input id="elmonths" type="number" value="${l.months}"></label><label>${tr('next')}<input id="eldate" type="date" value="${l.next_payment}"></label><label>${tr('remaining')}<input id="elremaining" type="number" value="${l.remaining}"></label><label>${tr('loanStatus')}<select id="elstatus"><option value="active">${tr('active')}</option><option value="completed">${tr('completed')}</option></select></label><button class="btn primary">${tr('saveLoan')}</button></form></div></div>`;
 document.getElementById('elstatus').value=l.status==='completed'?'completed':'active';
 document.getElementById('loanEditForm').onsubmit=async e=>{e.preventDefault();l.name=document.getElementById('elname').value;l.amount=Number(document.getElementById('elamount').value);l.rate=Number(document.getElementById('elrate').value);l.months=Number(document.getElementById('elmonths').value);l.next_payment=document.getElementById('eldate').value;l.remaining=Number(document.getElementById('elremaining').value);l.status=document.getElementById('elstatus').value;l.payment=emi(l.amount,l.rate,l.months);await cloudUpsertLoan(l);closeModal();render()};
}
async function deleteLoan(id){if(!confirm(tr('deleteConfirm')))return;state.loans=state.loans.filter(l=>l.id!==id);render();if(sb&&state.user){const {error}=await sb.from('loans').delete().eq('id',id);if(error)console.warn(error)}}
async function markPaid(id){
 const l=state.loans.find(x=>x.id===id);if(!l)return;if(!confirm(tr('markPaidConfirm')))return;
 const rows=schedule(l.amount,l.rate,l.months,l.next_payment,l.frequency),first=rows[0],newRemaining=Math.max(0,(Number(l.remaining)||0)-(Number(first?.principal)||0));
 if(sb&&state.user){const {error}=await sb.from('payments').insert({loan_id:l.id,user_id:state.user.id,payment_date:l.next_payment,amount:l.payment,principal:first?.principal||0,interest:first?.interest||0,status:'paid'});if(error){toast(error.message,true);return}}
 l.remaining=newRemaining;l.next_payment=nextDate(l.next_payment,l.frequency);if(l.remaining<=0.01)l.status='completed';await cloudUpsertLoan(l);render();
}
function nextDate(d,f){
 const [y,m,day]=String(d).slice(0,10).split('-').map(Number);
 const x=new Date(y,m-1,day);
 if(f==='weekly')x.setDate(x.getDate()+7);else x.setMonth(x.getMonth()+1);
 return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
async function deleteSaved(id){
 if(!confirm(tr('deleteConfirm')))return;state.saved=state.saved.filter(x=>(x.id||x.local_id)!==id);render();
 if(sb&&state.user&&id){const {error}=await sb.from('saved_calculations').delete().eq('id',id);if(error)console.warn(error)}
}
function openChangePassword(){
 document.getElementById('modalroot').innerHTML=`<div class="overlay"><div class="modal"><div class="modalhead"><div><b>${tr('changePass')}</b></div><button class="btn" onclick="closeModal()">×</button></div>
 <form id="cpform"><label>${tr('newPassword')}<input id="newpass" type="password" minlength="6" required></label><label>${tr('confirmNewPass')}<input id="newpass2" type="password" minlength="6" required></label><button class="btn primary">${tr('saveChanges')}</button></form><div id="cpmsg"></div></div></div>`;
 document.getElementById('cpform').onsubmit=async e=>{e.preventDefault();let m=document.getElementById('cpmsg');if(newpass.value!==newpass2.value){m.className='msg error';m.textContent='Passwords do not match.';return}const {error}=await sb.auth.updateUser({password:newpass.value});m.className='msg'+(error?' error':'');m.textContent=error?friendlyAuthError(error):tr('passwordChanged');if(!error)setTimeout(closeModal,900)};
}
function openAI(){
 document.getElementById('modalroot').innerHTML=`<div class="overlay"><div class="modal"><div class="modalhead"><div><b>✦ ${tr('ai')}</b><div class="small">${tr('aiHint')}</div></div><button class="btn" onclick="closeModal()">×</button></div><div class="chat" id="answer">${tr('aiDefault')}</div><div class="chatrow"><input id="q" placeholder="${esc(tr('aiPlaceholder'))}"><button class="btn primary" onclick="askAI()">${tr('ask')}</button></div></div></div>`;
}
function askAI(){
 let q=document.getElementById('q').value.toLowerCase(),c=cap(),p=payment(),a;
 if(/salary|afford|budget|comfortable|safe/.test(q))a=`${tr('comfortable')}: ${money(c.comfortable)} · ${tr('higher')}: ${money(c.higher)} · ${tr('risky')}: ${money(c.risky)}. ${tr('available')}: ${money(c.available)}.`;
 else if(/interest|emi|payment|installment/.test(q))a=`${money(state.amount)} at ${state.rate}% for ${state.months} months → ${state.freq} ${tr('payment')}: ${money(p)}. ${tr('totalInterest')}: ${money(total()-state.amount)}.`;
 else if(/prepay|foreclose/.test(q))a='Extra principal paid earlier can reduce future interest. Check your lender for any prepayment or foreclosure charges.';
 else if(/reminder|due|overdue/.test(q))a=tr('reminderText');
 else a=tr('aiDefault');
 document.getElementById('answer').textContent=a;
}
function openReport(){go('reports')}
function rowsForLoan(l){
 return schedule(l.amount,l.rate,l.months,l.next_payment,l.frequency).map((r,i)=>{r.status=i===0?(statusOf(l)==='overdue'?'overdue':'pending'):'pending';return r});
}
function exportCurrentXlsx(){
 const rows=currentRows().map(r=>({[tr('number')]:r.n,[tr('date')]:new Date(r.date+'T00:00:00'),[tr('payment')]:r.payment,[tr('principal')]:r.principal,[tr('interest')]:r.interest,[tr('balance')]:r.balance,[tr('status')]:tr('pending')}));
 exportXlsx(rows,'loan-smart-payment-schedule.xlsx',true);
}
function exportAllXlsx(){
 let rows=[];state.loans.forEach(l=>rowsForLoan(l).forEach(r=>rows.push({[tr('number')]:r.n,[tr('loans')]:l.name,[tr('date')]:new Date(r.date+'T00:00:00'),[tr('payment')]:r.payment,[tr('principal')]:r.principal,[tr('interest')]:r.interest,[tr('balance')]:r.balance,[tr('status')]:tr(r.status==='overdue'?'overdue':'pending')})));
 exportXlsx(rows,'loan-smart-report.xlsx',true);
}
function exportXlsx(rows,name,formatted){
 if(!window.XLSX){toast('Excel library unavailable.',true);return}
 const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Loan Report');
 const range=XLSX.utils.decode_range(ws['!ref']||'A1:A1');
 for(let c=0;c<=range.e.c;c++){const cell=ws[XLSX.utils.encode_cell({r:0,c})];if(cell)cell.s={font:{bold:true}}}
 for(let r=1;r<=range.e.r;r++)for(let c=0;c<=range.e.c;c++){const cell=ws[XLSX.utils.encode_cell({r,c})];if(!cell)continue;const head=String(ws[XLSX.utils.encode_cell({r:0,c})]?.v||'').toLowerCase();if(head===tr('date').toLowerCase())cell.z='dd-mmm-yyyy';if(/payment|principal|interest|balance|amount|remaining/i.test(head))cell.z='#,##0.00'}
 ws['!cols']=Array.from({length:range.e.c+1},(_,i)=>({wch:i===1?28:18}));XLSX.writeFile(wb,name);
}
function csvEscape(v){return `"${String(v??'').replace(/"/g,'""')}"`}
function exportCurrentCSV(){let rows=currentRows();let csv=[['No','Date','Payment','Principal','Interest','Balance','Status'],...rows.map(r=>[r.n,r.date,r.payment.toFixed(2),r.principal.toFixed(2),r.interest.toFixed(2),r.balance.toFixed(2),tr('pending')])].map(r=>r.map(csvEscape).join(',')).join('\n');downloadBlob(csv,'loan-smart-payment-schedule.csv','text/csv')}
function exportAllCSV(){let out=[['No','Loan','Date','Payment','Principal','Interest','Balance','Status']];state.loans.forEach(l=>rowsForLoan(l).forEach(r=>out.push([r.n,l.name,r.date,r.payment.toFixed(2),r.principal.toFixed(2),r.interest.toFixed(2),r.balance.toFixed(2),tr(r.status==='overdue'?'overdue':'pending')])));downloadBlob(out.map(r=>r.map(csvEscape).join(',')).join('\n'),'loan-smart-report.csv','text/csv')}
function downloadBlob(text,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCurrentPDF(){exportPDF('LOAN SMART · RL',currentRows().map(r=>[r.n,dateFmt(r.date),money(r.payment),money(r.principal),money(r.interest),money(r.balance),tr('pending')]))}
function exportAllPDF(){let rows=[];state.loans.forEach(l=>rowsForLoan(l).forEach(r=>rows.push([l.name,dateFmt(r.date),money(r.payment),money(r.principal),money(r.interest),money(r.balance),tr(r.status==='overdue'?'overdue':'pending')])));exportPDF('LOAN SMART · RL — '+tr('reports'),rows)}
function exportPDF(title,rows){
 if(!window.jspdf){toast('PDF library unavailable.',true);return}const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape'});doc.setFontSize(16);doc.text(title,14,16);doc.setFontSize(9);doc.text(new Date().toLocaleString(),14,23);let y=32;
 const headers=rows[0]&&rows[0].length===7?(title.includes('reports')?['Loan',tr('date'),tr('payment'),tr('principal'),tr('interest'),tr('balance'),tr('status')]:['#',tr('date'),tr('payment'),tr('principal'),tr('interest'),tr('balance'),tr('status')]):[];
 doc.setFont(undefined,'bold');headers.forEach((h,i)=>doc.text(String(h),14+i*39,y));doc.setFont(undefined,'normal');
 let yy=y+7;rows.forEach((r,ri)=>{if(yy>190){doc.addPage();yy=16;doc.setFont(undefined,'bold');headers.forEach((h,i)=>doc.text(String(h),14+i*39,yy));doc.setFont(undefined,'normal');yy+=7}r.forEach((v,i)=>doc.text(String(v).slice(0,22),14+i*39,yy));yy+=6});doc.save('loan-smart-statement.pdf');
}
async function uploadDocument(loanId){
 if(!sb||!state.user){toast(tr('loginSync'),true);return}
 const inp=document.createElement('input');inp.type='file';inp.accept='.pdf,.jpg,.jpeg,.png,.doc,.docx';inp.onchange=async()=>{
  const file=inp.files[0];if(!file)return;if(file.size>10*1024*1024){toast(tr('fileTooLarge'),true);return}
  const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${state.user.id}/${loanId}/${Date.now()}-${safe}`;
  const {error}=await sb.storage.from('loan-documents').upload(path,file,{upsert:false});if(error){toast(error.message,true);return}
  const {error:e2}=await sb.from('loan_documents').insert({user_id:state.user.id,loan_id:loanId,file_name:file.name,storage_path:path,mime_type:file.type,size_bytes:file.size});if(e2){await sb.storage.from('loan-documents').remove([path]);toast(e2.message,true);return}
  toast(tr('uploaded'));openDocuments(loanId);
 };inp.click();
}
async function openDocuments(loanId){
 const l=state.loans.find(x=>x.id===loanId);if(!l)return;
 let docs=[];if(sb&&state.user){const {data}=await sb.from('loan_documents').select('*').eq('loan_id',loanId).order('created_at',{ascending:false});docs=data||[]}
 document.getElementById('modalroot').innerHTML=`<div class="overlay"><div class="modal"><div class="modalhead"><div><b>${tr('documents')}: ${esc(l.name)}</b><div class="small">${tr('documentHint')}</div></div><button class="btn" onclick="closeModal()">×</button></div>
 <button class="btn primary" onclick="uploadDocument('${loanId}')">+ ${tr('upload')}</button><div id="docsList" style="margin-top:12px">${docs.length?docs.map(d=>`<div class="file"><div><b>${esc(d.file_name)}</b><div class="small">${(Number(d.size_bytes||0)/1024).toFixed(1)} KB · ${dateFmt((d.created_at||'').slice(0,10))}</div></div><div class="actions2"><button class="btn" onclick="downloadDocument('${d.id}')">${tr('download')}</button><button class="btn danger" onclick="deleteDocument('${d.id}','${esc(d.storage_path)}','${loanId}')">${tr('remove')}</button></div></div>`).join(''):`<div class="empty">${tr('documentsEmpty')}</div>`}</div></div></div>`;
}
async function downloadDocument(id){const {data,error}=await sb.from('loan_documents').select('storage_path,file_name').eq('id',id).single();if(error){toast(error.message,true);return}const r=await sb.storage.from('loan-documents').download(data.storage_path);if(r.error){toast(r.error.message,true);return}const a=document.createElement('a');a.href=URL.createObjectURL(r.data);a.download=data.file_name;a.click()}
async function deleteDocument(id,path,loanId){if(!confirm(tr('deleteConfirm')))return;await sb.storage.from('loan-documents').remove([path]);await sb.from('loan_documents').delete().eq('id',id);openDocuments(loanId)}
function openLoanDetails(id){
 const l=state.loans.find(x=>x.id===id);if(!l)return;
 document.getElementById('modalroot').innerHTML=`<div class="overlay"><div class="modal"><div class="modalhead"><div><b>${esc(l.name)}</b><div class="small">${money(l.amount)} · ${l.rate}%</div></div><button class="btn" onclick="closeModal()">×</button></div>
 <div class="grid2"><div class="stat"><span>${tr('remaining')}</span><b>${money(l.remaining)}</b></div><div class="stat"><span>${tr('payment')}</span><b>${money(l.payment)}</b></div></div>
 <div class="actions2" style="margin-top:15px"><button class="btn primary" onclick="markPaid('${l.id}')">${tr('markPaid')}</button><button class="btn" onclick="openDocuments('${l.id}')">${tr('documents')}</button><button class="btn" onclick="editLoan('${l.id}')">${tr('edit')}</button></div>
 <h3 style="margin-top:20px">${tr('history')}</h3><div id="paymentHistory" class="small">${tr('noHistory')}</div></div></div>`;
 loadPaymentHistory(l.id);
}
async function loadPaymentHistory(loanId){if(!sb||!state.user)return;const {data}=await sb.from('payments').select('*').eq('loan_id',loanId).order('payment_date',{ascending:false});const el=document.getElementById('paymentHistory');if(!el)return;el.innerHTML=data?.length?data.map(p=>`<div class="file"><span>${dateFmt(p.payment_date)}</span><b>${money(p.amount)} · ${tr('paid')}</b></div>`).join(''):tr('noHistory')}
/* Make loan rows clickable on the name while preserving edit/delete buttons. */
document.addEventListener('click',e=>{const el=e.target.closest('[data-loan-details]');if(el)openLoanDetails(el.dataset.loanDetails)});

document.getElementById('theme').onclick=()=>setTheme(!state.dark);
document.getElementById('themeSide').onclick=()=>setTheme(!state.dark);
document.getElementById('authTop').onclick=()=>state.user?go('settings'):openAuth();
document.getElementById('aiBtn').onclick=openAI;

if(sb){
 sb.auth.getSession().then(async({data})=>{state.user=data.session?.user||null;if(state.user)await sync();else render()});
 sb.auth.onAuthStateChange(async(event,session)=>{state.user=session?.user||null;if(event==='PASSWORD_RECOVERY'){openChangePassword();return}render()});
}
render();
</script>
</body>
